name: CausalMesh CI
on:
  push:
    paths:
      - 'projects/causalmesh/**'
      - '.github/workflows/causalmesh-ci.yml'
  pull_request:
    paths:
      - 'projects/causalmesh/**'
      - '.github/workflows/causalmesh-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/causalmesh
    strategy:
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m causalmesh --db /tmp/causalmesh-ci.db demo --transfers 75
      - run: python -m causalmesh --db /tmp/causalmesh-ci.db audit
      - run: python -m causalmesh --db /tmp/causalmesh-ci.db replay
