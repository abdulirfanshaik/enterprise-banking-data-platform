[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalmesh-ledger"
version = "0.1.0"
description = "Verifiable, bitemporal financial-event processing with counterfactual replay"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]
stream = ["kafka-python>=2.0,<3"]
lake = ["duckdb>=1.1,<2"]
spark = ["pyspark>=4.0,<4.1"]
spark-test = ["pyspark>=4.0,<4.1", "pytest>=8,<10"]

[project.scripts]
causalmesh = "causalmesh.cli:main"
causalmesh-lakehouse = "causalmesh.cloud.job:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
causalmesh = ["static/*.html"]
