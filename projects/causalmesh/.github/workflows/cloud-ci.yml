name: CausalMesh Cloud CI (template)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python-cloud-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev,spark-test]'
      - run: python -m compileall -q src tests airflow scripts
      - run: ruff check .
      - run: pytest -q
        env:
          SPARK_LOCAL_HOSTNAME: localhost
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
      - run: bash scripts/cloud_demo.sh
        env:
          SPARK_LOCAL_HOSTNAME: localhost
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
