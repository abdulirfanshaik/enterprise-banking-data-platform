version: 2

models:
  - name: stg_payments
    description: Canonical, deduplicated synthetic payment events.
    columns:
      - name: payment_id
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: amount
        tests: [not_null]
  - name: fct_daily_payments
    description: Daily payment control totals by channel.
    columns:
      - name: event_date
        tests: [not_null]
      - name: payment_type
        tests: [not_null]
