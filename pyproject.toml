[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-banking-data-platform"
version = "1.0.0"
description = "Synthetic payments, AML, Customer 360, and regulatory data platform"
requires-python = ">=3.10"
authors = [{name = "Irfan Shaik"}]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
